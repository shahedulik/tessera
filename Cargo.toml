[workspace]
members = ["crates/tessera_core", "crates/tessera_vision"]
resolver = "2"

[workspace.dependencies]
core_affinity = "0.8.1"
tokio = { version = "1.36", features = ["full"] }
arrow = { version = "58", features = ["prettyprint", "csv"] }
libm = "0.2"
proptest = "1"
candle-core = { version = "0.11", features = ["cuda"] }
candle-nn = { version = "0.11", features = ["cuda"] }
candle-transformers = { version = "0.11", features = ["cuda"] }
pdfium-render = { version = "=0.8.37", default-features = false, features = ["thread_safe", "image", "pdfium_6996"] }
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png", "bmp"] }
duckdb = { version = "=1.10505.0", features = ["bundled"] }
kuzu = { version = "0.11.3", default-features = false }
dashmap = "5.5"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
